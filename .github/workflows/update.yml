name: Auto-Update M3U Playlist

on:
  schedule:
    # This runs the script automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to also run it manually anytime

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    # CHANGED: Upgraded from @v4 to @v6 for Node 24 support
    - name: Checkout Repository
      uses: actions/checkout@v6

    # CHANGED: Upgraded from @v5 to @v6 for Node 24 support
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Run Converter Script
      run: python convert.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add jadoo_playlist.m3u
        git diff-index --quiet HEAD || (git commit -m "Auto-update playlist" && git push)
